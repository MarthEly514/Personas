<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personas: SVG Character Generator</title>
    <style>
        /* CSS resets and minimal styling */
        :root {
            --bg-color: #fdfcf8; /* Off-white */
            --accent-color: #000; /* Black */
            --border-radius: 8px;
            --panel-bg: #fff;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--accent-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top navigation / Title */
        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 700;
        }

        header .controls {
            display: flex;
            gap: 1rem;
        }

        /* Main layout: left preview, right controls */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Preview Area */
        #preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            border-right: 1px solid rgba(0,0,0,0.1);
            background-color: #f9f8f4;
        }

        #persona-frame {
            width: 393px;
            height: 852px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        svg#persona-svg {
            display: block; /* fix potential white space below svg */
        }

        /* Controls Panel */
        #controls-panel {
            width: 380px;
            padding: 1.5rem;
            overflow-y: auto;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Accordion-style sections */
        .control-section {
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: var(--border-radius);
            overflow: hidden;
        }

        .control-header {
            background-color: #fafafa;
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-header::after {
            content: '+';
            font-size: 1.1rem;
            font-weight: 700;
        }

        .control-section.open .control-header::after {
            content: '-';
        }

        .control-content {
            display: none;
            padding: 1rem;
            background-color: #fff;
            flex-direction: column;
            gap: 0.75rem;
        }

        .control-section.open .control-content {
            display: flex;
        }

        /* Individual control rows */
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .control-label {
            font-size: 0.85rem;
            color: #555;
            font-weight: 500;
        }

        /* Input styling */
        select, input[type="text"] {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            font-size: 0.8rem;
            background-color: #fff;
            color: var(--accent-color);
            width: 100%;
        }

        /* Swatches and Color Pickers */
        .color-picker-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .color-value {
            font-size: 0.8rem;
            color: #888;
            font-family: monospace;
        }

        /* Toggles */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ddd;
            transition: .2s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Buttons */
        .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 0.6rem 1rem;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background-color: #333;
        }

        .btn.secondary {
            background-color: transparent;
            color: var(--accent-color);
        }

        .btn.secondary:hover {
            background-color: rgba(0,0,0,0.05);
        }

    </style>
</head>

</header>

    <aside id="controls-panel">
        <!-- Structure -->
        <div class="control-section open">
            <div class="control-header">Structure</div>
            <div class="control-content">
                <div class="control-row">
                    <label class="control-label" for="skin-select">Skin Tone</label>
                    <select id="skin-select">
                        <option value="#FFFCF9">Base (Default)</option>
                        <option value="#F8D3C4">Fair</option>
                        <option value="#E5A684">Medium</option>
                        <option value="#8D5524">Tan</option>
                        <option value="#5E3A1A">Dark</option>
                        <!-- Users can add custom tones via JS easily later -->
                    </select>
                </div>
            </div>
        </div>

        <!-- Hair -->
        <div class="control-section">
            <div class="control-header">Hair</div>
            <div class="control-content">
                <div class="control-row">
                    <label class="control-label" for="hair-style-select">Style</label>
                    <select id="hair-style-select">
                        <option value="base">Original (Default)</option>
                        <option value="bob">Bob Cut (Stub)</option>
                        <option value="punk">Punk Mohawk (Stub)</option>
                    </select>
                </div>
                <div class="control-row">
                    <label class="control-label">Hair Color</label>
                    <div class="color-picker-row">
                        <input type="color" id="hair-color-picker" value="#FFC9D9">
                        <span class="color-value">#FFC9D9</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Face -->
        <div class="control-section">
            <div class="control-header">Face</div>
            <div class="control-content">
                <div class="control-row">
                    <label class="control-label" for="mouth-select">Mouth</label>
                    <select id="mouth-select">
                        <option value="default">Default Smile</option>
                        <option value="flat">Flat Line (Stub)</option>
                        <option value="open">O-Mouth (Stub)</option>
                    </select>
                </div>
                <div class="control-row">
                    <label class="control-label" for="eyes-select">Eyes</label>
                    <select id="eyes-select">
                        <option value="default">Default Eyes</option>
                        <option value="blink">Blink / Wince (Stub)</option>
                        <option value="glance">Glance Left (Stub)</option>
                    </select>
                </div>
                <div class="control-row">
                    <label class="control-label">Iris Color</label>
                    <div class="color-picker-row">
                        <input type="color" id="eye-color-picker" value="#9AFFDD">
                        <span class="color-value">#9AFFDD</span>
                    </div>
                </div>
                <div class="control-row">
                    <label class="control-label" for="blush-toggle">Enable Blush</label>
                    <label class="switch">
                        <input type="checkbox" id="blush-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Clothes -->
        <div class="control-section">
            <div class="control-header">Clothes</div>
            <div class="control-content">
                <div class="control-row">
                    <label class="control-label" for="top-select">Top Style</label>
                    <select id="top-select">
                        <option value="default">V-Neck Top</option>
                        <option value="shirt">T-Shirt (Stub)</option>
                        <option value="hoodie">Hoodie (Stub)</option>
                    </select>
                </div>
                <div class="control-row">
                    <label class="control-label">Top Color</label>
                    <div class="color-picker-row">
                        <input type="color" id="top-color-picker" value="#B24F6C">
                        <span class="color-value">#B24F6C</span>
                    </div>
                </div>
                <div class="control-row">
                    <label class="control-label" for="bottom-select">Bottom Style</label>
                    <select id="bottom-select">
                        <option value="default">Trousers</option>
                        <option value="shorts">Shorts (Stub)</option>
                        <option value="skirt">Skirt (Stub)</option>
                    </select>
                </div>
                <div class="control-row">
                    <label class="control-label">Bottom Color</label>
                    <div class="color-picker-row">
                        <input type="color" id="bottom-color-picker" value="#929292">
                        <span class="color-value">#929292</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>
</main>

<script>
    // --- UTILITIES ---
    // Helper to change multiple fill colors in SVG by class
    function setFillsByClass(className, color) {
        const elements = document.querySelectorAll(`.${className}`);
        elements.forEach(el => el.setAttribute('fill', color));
    }

    // --- ACCORDION LOGIC ---
    document.querySelectorAll('.control-header').forEach(header => {
        header.addEventListener('click', () => {
            header.parentElement.classList.toggle('open');
        });
    });

    // --- CUSTOMIZATION LOGIC ---

    // 1. Skin Tone
    const skinSelect = document.getElementById('skin-select');
    skinSelect.addEventListener('change', (e) => {
        const color = e.target.value;
        document.getElementById('skin-body-fill').setAttribute('fill', color);
        document.getElementById('skin-face-fill').setAttribute('fill', color);
        setFillsByClass('skin-ear-fill', color); // Handles multiple ear elements
    });

    // 2. Hair (Color and Style swap stubs)
    const hairColorPicker = document.getElementById('hair-color-picker');
    hairColorPicker.addEventListener('input', (e) => {
        const color = e.target.value;
        hairColorPicker.nextElementSibling.textContent = color.toUpperCase();
        // Swapping hair means swapping front and back simultaneously
        document.getElementById('hair-back-fill').setAttribute('fill', color);
        document.getElementById('hair-front-fill').setAttribute('fill', color);
    });

    const hairStyleSelect = document.getElementById('hair-style-select');
    hairStyleSelect.addEventListener('change', (e) => {
        // Simple prototype: we just show/hide the original hair logic.
        // Full logic would load different groups.
        const layerFront = document.querySelector('.layer-hair-front');
        const layerBack = document.querySelector('.layer-hair-back');
        if (e.target.value === 'base') {
            layerFront.style.display = 'block';
            layerBack.style.display = 'block';
        } else {
            // Stub message
            alert(`Swapping to style: ${e.target.value}. (Requires additional SVG data for this prototype)`);
            layerFront.style.display = 'none';
            layerBack.style.display = 'none';
        }
    });

    // 3. Face (Eyes/Mouth swap stubs, blush toggle)
    const mouthSelect = document.getElementById('mouth-select');
    mouthSelect.addEventListener('change', (e) => {
        alert(`Swapping mouth to: ${e.target.value}. (Requires additional SVG mouth groups)`);
    });

    const eyesSelect = document.getElementById('eyes-select');
    eyesSelect.addEventListener('change', (e) => {
        alert(`Swapping eyes to: ${e.target.value}. (Requires additional SVG eye groups)`);
    });

    const eyeColorPicker = document.getElementById('eye-color-picker');
    eyeColorPicker.addEventListener('input', (e) => {
        const color = e.target.value;
        eyeColorPicker.nextElementSibling.textContent = color.toUpperCase();
        setFillsByClass('eye-iris-fill', color);
    });

    const blushToggle = document.getElementById('blush-toggle');
    blushToggle.addEventListener('change', (e) => {
        const blushGroup = document.getElementById('blush-layers');
        blushGroup.style.display = e.target.checked ? 'block' : 'none';
    });

    // 4. Clothes (Tops/Bottoms swap stubs and colors)
    const topSelect = document.getElementById('top-select');
    topSelect.addEventListener('change', (e) => {
        alert(`Swapping top to: ${e.target.value}. (Requires additional SVG top groups)`);
    });

    const topColorPicker = document.getElementById('top-color-picker');
    topColorPicker.addEventListener('input', (e) => {
        const color = e.target.value;
        topColorPicker.nextElementSibling.textContent = color.toUpperCase();
        setFillsByClass('clothes-top-fill', color);
    });

    const bottomSelect = document.getElementById('bottom-select');
    bottomSelect.addEventListener('change', (e) => {
        alert(`Swapping bottom to: ${e.target.value}. (Requires additional SVG bottom groups)`);
    });

    const bottomColorPicker = document.getElementById('bottom-color-picker');
    bottomColorPicker.addEventListener('input', (e) => {
        const color = e.target.value;
        bottomColorPicker.nextElementSibling.textContent = color.toUpperCase();
        setFillsByClass('clothes-bottom-fill', color);
    });


    // --- GLOBAL ACTIONS ---

    // Reset button
    document.getElementById('reset-btn').addEventListener('click', () => {
        window.location.reload(); // Simple approach for a single file prototype
    });

    // Export SVG button
    document.getElementById('export-svg-btn').addEventListener('click', () => {
        const svg = document.getElementById('persona-svg');
        const serializer = new XMLSerializer();
        let source = serializer.serializeToString(svg);

        // Add namespaces if missing (ensures correct display on all platforms)
        if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
            source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
        }
        if (!source.match(/^<svg[^>]+xmlns\:xlink="http\:\/\/www\.w3\.org\/1999\/xlink"/)) {
            source = source.replace(/^<svg/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
        }

        // Add generic XML header
        source = '<?xml version="1.0" standalone="no"?>\r\n' + source;

        // Create a download link and trigger it
        const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(source);
        const link = document.createElement("a");
        link.href = url;
        link.download = "my-persona.svg";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

</script>
</body>
</html>
